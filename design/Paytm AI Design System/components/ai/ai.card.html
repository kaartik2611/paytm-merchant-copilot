<!-- @dsCard group="Components" viewport="700x900" name="AI extension components" subtitle="Insight · Recommendation · Risk alert · Explainability · Actions · Confidence" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-page); font-family: var(--font-sans); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .span { grid-column: 1 / -1; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-500); margin: 0 0 10px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const N = window.PaytmAIDesignSystem_ea0928;
  const { AIInsightCard, AIRecommendationCard, AIRiskAlert, AIExplainabilityPanel, AIActionCard } = N;
  function Demo() {
    return (
      <div className="grid">
        <div>
          <div className="lbl">Insight</div>
          <AIInsightCard
            title="You spent more on food this month"
            value="₹8,420"
            delta={{ dir: "up", text: "18% vs last month" }}
            trend={[5, 7, 6, 9, 8, 12, 14]}
            category="insight"
            confidence="high"
          />
        </div>
        <div>
          <div className="lbl">Recommendation</div>
          <AIRecommendationCard
            icon="piggy-bank"
            title="Move ₹5,000 to a Fixed Deposit"
            body="Your balance has stayed above ₹20,000 for 3 months. A Paytm FD could earn you more."
            impact="Earn ~₹375 / year"
            confidence="medium"
            acceptLabel="Open FD"
          />
        </div>
        <div>
          <div className="lbl">Risk alert</div>
          <AIRiskAlert
            severity="high"
            title="This looks like a scam request"
            body="The receiver was reported 14 times this week. Paytm never asks you to pay to receive a refund."
            confidence="high"
            primaryLabel="Block & report"
            secondaryLabel="Proceed anyway"
          />
        </div>
        <div>
          <div className="lbl">Explainability</div>
          <AIExplainabilityPanel
            reason="We flagged this because the payee is new and the amount is far above your usual transfers."
            factors={[
              { name: "Payee reported by others", weight: 88 },
              { name: "First time paying this number", weight: 64 },
              { name: "Amount 4× your average", weight: 52 },
            ]}
            confidenceLabel="Based on your last 6 months of activity"
          />
        </div>
        <div className="span">
          <div className="lbl">Actions</div>
          <AIActionCard
            actions={[
              { title: "Block this transaction", sub: "Recommended", icon: "shield-alert", tone: "danger" },
              { title: "Proceed anyway", sub: "I trust this payee", icon: "arrow-right" },
              { title: "Talk to Paytm support", sub: "Get help in 2 mins", icon: "headset", tone: "primary" },
            ]}
          />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
