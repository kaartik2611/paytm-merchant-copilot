<!-- @dsCard group="Components" viewport="700x720" name="AI Copilot chat" subtitle="Mobile sheet & web panel — type a message to try it" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bg-page); font-family: var(--font-sans); }
  .stage { display: flex; gap: 26px; align-items: flex-start; justify-content: center; }
  .phone { width: 340px; height: 640px; border-radius: 30px; background: #fff; box-shadow: var(--elev-3); overflow: hidden; }
  .web { width: 320px; height: 560px; box-shadow: var(--elev-2); border-radius: 14px; overflow: hidden; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-500); margin: 0 0 10px; text-align: center; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { CopilotChat } = window.PaytmAIDesignSystem_ea0928;
  function Demo() {
    return (
      <div className="stage">
        <div>
          <div className="lbl">Mobile</div>
          <div className="phone"><CopilotChat surface="mobile" /></div>
        </div>
        <div>
          <div className="lbl">Web panel</div>
          <div className="web">
            <CopilotChat
              surface="web"
              subtitle="Business assistant"
              suggestedPrompts={["How were sales this week?", "Which item is running low?", "Show pending settlements"]}
              initialMessages={[{ from: "assistant", text: "Hi! Ask me about your sales, settlements or inventory." }]}
              getReply={() => "Sales this week: ₹1,84,200 across 612 orders — up 9% on last week. Fridays are your peak."}
            />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
