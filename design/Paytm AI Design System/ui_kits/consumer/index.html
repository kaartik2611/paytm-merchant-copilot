<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8">
<title>Paytm Consumer — AI</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html,body{margin:0;height:100%;background:#eef1f6;font-family:var(--font-sans)}
  .wrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
  .phone{width:390px;height:760px;background:#000;border-radius:36px;padding:8px;box-shadow:0 24px 60px rgba(16,38,76,.28)}
  .screen{position:relative;width:100%;height:100%;border-radius:28px;overflow:hidden;background:var(--bg-page)}
</style></head>
<body><div class="wrap"><div class="phone"><div class="screen" id="root"></div></div></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel">
const React=window.React;

// === components/core/Icon.jsx ===

/**
 * Icon — curated line-icon set in the Lucide style (24×24, 2px stroke,
 * round caps) to match Paytm's thin-stroke navy glyphs. Inherits color
 * via `currentColor` and sizes via the `size` prop.
 */
const PATHS = {
  // AI / brand
  sparkles: <><path d="M9.94 4.5 12 9l4.5 2.06L12 13.1 9.94 17.6 7.88 13.1 3.38 11.06 7.88 9 9.94 4.5Z"/><path d="M18 5v3"/><path d="M16.5 6.5h3"/><path d="M18 16v2"/><path d="M17 17h2"/></>,
  sparkle: <path d="M12 3 14.09 9.26 20.5 11.5 14.09 13.74 12 20 9.91 13.74 3.5 11.5 9.91 9.26 12 3Z"/>,
  // arrows / chevrons
  "arrow-right": <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
  "arrow-left": <><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></>,
  "chevron-right": <path d="m9 18 6-6-6-6"/>,
  "chevron-down": <path d="m6 9 6 6 6-6"/>,
  "arrow-up-right": <><path d="M7 17 17 7"/><path d="M7 7h10v10"/></>,
  // chat / voice
  send: <><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></>,
  mic: <><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></>,
  "message-circle": <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>,
  // status
  check: <path d="M20 6 9 17l-5-5"/>,
  "check-circle": <><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></>,
  x: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
  info: <><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></>,
  "alert-triangle": <><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></>,
  "shield-check": <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="m9 12 2 2 4-4"/></>,
  "shield-alert": <><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z"/><path d="M12 8v4"/><path d="M12 16h.01"/></>,
  // finance / data
  "trending-up": <><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></>,
  "trending-down": <><path d="M16 17h6v-6"/><path d="m22 17-8.5-8.5-5 5L2 7"/></>,
  "bar-chart": <><path d="M3 3v18h18"/><rect x="7" y="11" width="3" height="6" rx="1"/><rect x="12" y="7" width="3" height="10" rx="1"/><rect x="17" y="13" width="3" height="4" rx="1"/></>,
  wallet: <><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4a1 1 0 0 1-1 1H5a2 2 0 0 1-2-2V5"/><path d="M18 12h.01"/></>,
  "indian-rupee": <><path d="M6 3h12"/><path d="M6 8h12"/><path d="m6 13 8.5 8"/><path d="M6 13h3a5 5 0 0 0 0-10"/></>,
  "piggy-bank": <><path d="M19 11a8 8 0 0 0-7-4H9a6 6 0 0 0-6 6 5 5 0 0 0 2 4v3h3v-2h4v2h3v-3a6 6 0 0 0 2-4Z"/><path d="M16 11h.01"/><path d="M2 9v2"/></>,
  scan: <><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><path d="M3 12h18"/></>,
  store: <><path d="M3 9 4.5 4h15L21 9"/><path d="M4 9v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9"/><path d="M3 9h18"/></>,
  lightbulb: <><path d="M9 18h6"/><path d="M10 22h4"/><path d="M8 14a5 5 0 1 1 8 0c-.7.9-1 1.5-1 3H9c0-1.5-.3-2.1-1-3Z"/></>,
  search: <><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></>,
  clock: <><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></>,
  package: <><path d="m7.5 4.3 9 5.2v9L7.5 13.4Z" opacity="0"/><path d="M12 2 3 7v10l9 5 9-5V7Z"/><path d="m3 7 9 5 9-5"/><path d="M12 22V12"/></>,
  user: <><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></>,
  headset: <><path d="M4 14v-2a8 8 0 0 1 16 0v2"/><path d="M18 19a2 2 0 0 1-2 2h-2"/><rect x="2" y="13" width="4" height="6" rx="1"/><rect x="18" y="13" width="4" height="6" rx="1"/></>,
  plus: <><path d="M12 5v14"/><path d="M5 12h14"/></>,
};

function Icon({ name, size = 20, strokeWidth = 2, className, style, ...rest }) {
  const path = PATHS[name];
  return (
    <svg
      width={size}
      height={size}
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      strokeWidth={strokeWidth}
      strokeLinecap="round"
      strokeLinejoin="round"
      className={className}
      style={style}
      aria-hidden="true"
      {...rest}
    >
      {path || null}
    </svg>
  );
}


// === components/core/Button.jsx ===

/**
 * Button — Paytm pill button. Primary (blue), secondary (outline),
 * ghost, navy, danger, success, neutral. Sizes sm/md/lg.
 */
function Button({
  children,
  variant = "primary",
  size = "lg",
  block = false,
  icon,
  iconRight,
  disabled = false,
  className = "",
  ...rest
}) {
  const cls = [
    "pt-btn",
    `pt-btn--${variant}`,
    `pt-btn--${size}`,
    block ? "pt-btn--block" : "",
    className,
  ].filter(Boolean).join(" ");
  const isz = size === "sm" ? 16 : 18;
  return (
    <button className={cls} disabled={disabled} {...rest}>
      {icon && <Icon name={icon} size={isz} />}
      {children}
      {iconRight && <Icon name={iconRight} size={isz} />}
    </button>
  );
}


// === components/core/Badge.jsx ===

/**
 * Badge — small status pill. tone: neutral | info | success | warning
 * | danger | brand | ai. Optional leading dot or icon.
 */
function Badge({ children, tone = "neutral", dot = false, icon, className = "", ...rest }) {
  const cls = ["pt-badge", `pt-badge--${tone}`, className].filter(Boolean).join(" ");
  return (
    <span className={cls} {...rest}>
      {dot && <span className="pt-badge__dot" />}
      {icon && <Icon name={icon} size={12} strokeWidth={2.4} />}
      {children}
    </span>
  );
}


// === components/core/Chip.jsx ===

/**
 * Chip — tappable pill for suggested prompts / quick actions / filters.
 * variant: default | ai.
 */
function Chip({ children, variant = "default", icon, onClick, className = "", ...rest }) {
  const cls = ["pt-chip", variant === "ai" ? "pt-chip--ai" : "", className].filter(Boolean).join(" ");
  return (
    <button type="button" className={cls} onClick={onClick} {...rest}>
      {icon && <Icon name={icon} size={15} />}
      {children}
    </button>
  );
}


// === components/core/IconCircle.jsx ===

/**
 * IconCircle — round tinted container for a line icon. Used across
 * service tiles, list rows and AI cards. Pass a `bg`/`color` to tint.
 */
function IconCircle({ icon, size = 40, bg, color, iconSize, className = "", style = {}, children }) {
  const s = { width: size, height: size, background: bg, color, ...style };
  return (
    <span className={["pt-iconcircle", className].filter(Boolean).join(" ")} style={s}>
      {icon ? <Icon name={icon} size={iconSize || Math.round(size * 0.5)} /> : children}
    </span>
  );
}


// === components/core/Avatar.jsx ===

/**
 * Avatar — circular user/merchant avatar. Renders an image when `src`
 * is given, otherwise initials on a colored background.
 */
function Avatar({ src, initials, size = 36, bg = "#F26464", color = "#fff", className = "", style = {} }) {
  const s = { width: size, height: size, background: src ? "transparent" : bg, color, fontSize: Math.round(size * 0.38), ...style };
  return (
    <span className={["pt-avatar", className].filter(Boolean).join(" ")} style={s}>
      {src ? <img src={src} alt={initials || "avatar"} /> : initials}
    </span>
  );
}


// === components/core/SectionHeader.jsx ===

/**
 * SectionHeader — bold section title with an optional right-aligned
 * action link (e.g. "View All").
 */
function SectionHeader({ title, action, onAction, className = "", ...rest }) {
  return (
    <div className={["pt-section", className].filter(Boolean).join(" ")} {...rest}>
      <span className="pt-section__title">{title}</span>
      {action && <span className="pt-section__action" onClick={onAction}>{action}</span>}
    </div>
  );
}


// === components/ai/AIAvatar.jsx ===

/**
 * AIAvatar — the Paytm AI mark: a sparkle on the sanctioned cyan→blue
 * →navy sheen. The single place the AI gradient is allowed. Use `soft`
 * for a low-emphasis tinted version on light surfaces.
 */
function AIAvatar({ size = 36, soft = false, square = false, className = "", style = {} }) {
  const cls = [
    "ai-mark",
    soft ? "ai-mark--soft" : "",
    square ? "ai-mark--square" : "",
    className,
  ].filter(Boolean).join(" ");
  return (
    <span className={cls} style={{ width: size, height: size, ...style }}>
      <Icon name="sparkles" size={Math.round(size * 0.56)} strokeWidth={2} />
    </span>
  );
}


// === components/ai/ConfidenceMeter.jsx ===

const LEVELS = {
  high: { label: "High confidence", color: "var(--confidence-high)", pct: 90 },
  medium: { label: "Medium confidence", color: "var(--confidence-med)", pct: 62 },
  low: { label: "Low confidence", color: "var(--confidence-low)", pct: 32 },
};

/**
 * ConfidenceMeter — communicates how sure the model is. Two styles:
 * a thin progress track (default) or a 5-bar signal. Accepts a level
 * preset ("high"|"medium"|"low") or an explicit `value` 0–100.
 */
function ConfidenceMeter({ level = "high", value, variant = "track", showLabel = true, label, className = "", style = {} }) {
  const preset = LEVELS[level] || LEVELS.high;
  const pct = value != null ? value : preset.pct;
  const color = preset.color;
  const text = label != null ? label : (value != null ? `${value}% confidence` : preset.label);

  if (variant === "bars") {
    const on = Math.round((pct / 100) * 5);
    return (
      <span className={["ai-conf", "ai-conf--bars", className].filter(Boolean).join(" ")} style={style}>
        <span className="ai-conf__bars" style={{ "--_c": color }}>
          {[0, 1, 2, 3, 4].map((i) => (
            <b key={i} className={i < on ? "on" : ""} style={{ height: 8 + i * 3 }} />
          ))}
        </span>
        {showLabel && <span className="ai-conf__label">{text}</span>}
      </span>
    );
  }
  return (
    <span className={["ai-conf", className].filter(Boolean).join(" ")} style={style}>
      <span className="ai-conf__track"><span className="ai-conf__fill" style={{ width: `${pct}%`, background: color }} /></span>
      {showLabel && <span className="ai-conf__label">{text}</span>}
    </span>
  );
}


// === components/ai/AIInsightCard.jsx ===

const ACCENT = {
  insight: "var(--cat-insight)",
  save: "var(--cat-save)",
  growth: "var(--cat-growth)",
  risk: "var(--cat-risk)",
};

/**
 * AIInsightCard — a generated insight (spending, usage, revenue, trend)
 * with a headline metric, optional delta, mini sparkline and an
 * AI provenance footer (confidence + "Why").
 */
function AIInsightCard({
  eyebrow = "AI Insight",
  title,
  value,
  delta,                 // { dir: "up"|"down", text: "12% vs last month" }
  trend,                 // array of numbers → sparkline
  category = "insight",
  confidence = "high",
  onWhy,
  footnote,
  className = "",
  style = {},
}) {
  const accent = ACCENT[category] || ACCENT.insight;
  const peak = trend ? Math.max(...trend) : 0;
  const max = peak || 1;
  return (
    <div className={["ai-card", "ai-card--rail", className].filter(Boolean).join(" ")} style={{ "--_accent": accent, ...style }}>
      <div className="ai-card__head">
        <AIAvatar size={30} soft />
        <span className="ai-card__eyebrow">{eyebrow}</span>
        {delta && (
          <span className={`ai-card__spacer ai-insight__delta ai-insight__delta--${delta.dir}`}>
            <Icon name={delta.dir === "up" ? "trending-up" : "trending-down"} size={14} strokeWidth={2.4} />
            {delta.text}
          </span>
        )}
      </div>
      <div className="ai-card__title">{title}</div>
      {value != null && (
        <div className="ai-insight__metric">
          <span className="ai-insight__value tnum">{value}</span>
        </div>
      )}
      {trend && (
        <div className="ai-insight__spark">
          {trend.map((v, i) => (
            <i key={i} className={v === peak ? "is-peak" : ""} style={{ height: `${Math.max(12, (v / max) * 100)}%` }} />
          ))}
        </div>
      )}
      {footnote && <div className="ai-card__body" style={{ marginTop: 10 }}>{footnote}</div>}
      <div className="ai-card__foot">
        <ConfidenceMeter level={confidence} variant="bars" />
        <span className="ai-card__spacer pt-section__action" onClick={onWhy} style={{ display: "inline-flex", alignItems: "center", gap: 4 }}>
          Why this? <Icon name="chevron-right" size={14} />
        </span>
      </div>
    </div>
  );
}


// === components/ai/AIRecommendationCard.jsx ===

/**
 * AIRecommendationCard — a suggested action the user can take (save
 * money, improve cash flow, increase sales, optimize inventory). Leads
 * with an icon, a benefit-led title, the projected impact, and a
 * primary accept + secondary dismiss.
 */
function AIRecommendationCard({
  icon = "piggy-bank",
  iconBg = "var(--success-tint)",
  iconColor = "var(--success)",
  title,
  body,
  impact,               // e.g. "Save ~₹450 / month"
  confidence = "high",
  acceptLabel = "Do it",
  onAccept,
  onDismiss,
  className = "",
  style = {},
}) {
  return (
    <div className={["ai-card", className].filter(Boolean).join(" ")} style={style}>
      <div className="ai-card__head" style={{ marginBottom: 12 }}>
        <AIAvatar size={26} soft />
        <span className="ai-card__eyebrow">AI Recommendation</span>
        <ConfidenceMeter level={confidence} variant="bars" showLabel={false} className="ai-card__spacer" />
      </div>
      <div className="ai-reco">
        <IconCircle className="ai-reco__icon" icon={icon} size={44} bg={iconBg} color={iconColor} />
        <div>
          <div className="ai-card__title" style={{ marginBottom: 5 }}>{title}</div>
          <div className="ai-card__body">{body}</div>
          {impact && (
            <div style={{ marginTop: 10 }}>
              <span className="ai-reco__impact">{impact}</span>
            </div>
          )}
        </div>
      </div>
      <div className="ai-card__foot">
        <Button variant="primary" size="md" onClick={onAccept}>{acceptLabel}</Button>
        <Button variant="ghost" size="md" onClick={onDismiss}>Not now</Button>
      </div>
    </div>
  );
}


// === components/ai/AIRiskAlert.jsx ===

const SEV = {
  critical: { icon: "shield-alert", label: "Critical" },
  high:     { icon: "shield-alert", label: "High risk" },
  medium:   { icon: "alert-triangle", label: "Medium" },
  low:      { icon: "info", label: "Heads up" },
};

/**
 * AIRiskAlert — fraud / scam / unusual-activity / revenue-risk warning.
 * Carries a severity level, confidence score and clear next actions.
 * Tinted by severity; never alarmist red unless severity is high+.
 */
function AIRiskAlert({
  severity = "high",
  title,
  body,
  confidence = "high",
  primaryLabel = "Block transaction",
  secondaryLabel = "It's safe",
  onPrimary,
  onSecondary,
  primaryVariant,
  className = "",
  style = {},
}) {
  const s = SEV[severity] || SEV.high;
  const isDanger = severity === "critical" || severity === "high";
  return (
    <div className={["ai-risk", `ai-risk--${severity}`, className].filter(Boolean).join(" ")} style={style}>
      <div className="ai-risk__head">
        <span className="ai-risk__icon"><Icon name={s.icon} size={19} strokeWidth={2.2} /></span>
        <div style={{ flex: 1 }}>
          <span className="ai-risk__sev">{s.label}</span>
          <div className="ai-risk__title">{title}</div>
        </div>
      </div>
      <p className="ai-risk__body">{body}</p>
      <div style={{ marginTop: 12 }}>
        <ConfidenceMeter level={confidence} variant="track" />
      </div>
      <div className="ai-risk__actions">
        <Button variant={primaryVariant || (isDanger ? "danger" : "primary")} size="md" onClick={onPrimary}>{primaryLabel}</Button>
        {secondaryLabel && <Button variant="secondary" size="md" onClick={onSecondary}>{secondaryLabel}</Button>}
      </div>
    </div>
  );
}


// === components/ai/AIExplainabilityPanel.jsx ===

/**
 * AIExplainabilityPanel — the "why" behind a recommendation or alert.
 * Shows a plain-language reason, the weighted supporting factors, and
 * an overall confidence read-out. Builds trust through transparency.
 */
function AIExplainabilityPanel({
  title = "Why you're seeing this",
  reason,
  factors = [],          // [{ name, weight: 0–100 }]
  confidenceLabel = "Based on 6 months of your activity",
  className = "",
  style = {},
}) {
  return (
    <div className={["ai-explain", className].filter(Boolean).join(" ")} style={style}>
      <div className="ai-explain__head">
        <AIAvatar size={26} soft />
        <span className="ai-explain__title">{title}</span>
      </div>
      {reason && <p className="ai-explain__why">{reason}</p>}
      <div className="ai-explain__factors">
        {factors.map((f, i) => (
          <div className="ai-factor" key={i}>
            <span className="ai-factor__name">{f.name}</span>
            <span className="ai-factor__track"><span className="ai-factor__fill" style={{ width: `${f.weight}%` }} /></span>
            <span className="ai-factor__pct tnum">{f.weight}%</span>
          </div>
        ))}
      </div>
      {confidenceLabel && (
        <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 14, color: "var(--ink-500)", fontSize: "var(--fs-xs)", fontWeight: 500 }}>
          <Icon name="shield-check" size={14} />
          {confidenceLabel}
        </div>
      )}
    </div>
  );
}


// === components/ai/AIActionCard.jsx ===

/**
 * AIActionCard — a set of clear decisions the user can take in response
 * to AI output (block / proceed / contact support / accept). Renders a
 * vertical list of tappable actions; one can be marked primary, one
 * destructive.
 */
function AIActionCard({ title, actions = [], row = false, className = "", style = {} }) {
  return (
    <div className={className} style={style}>
      {title && <div className="ai-card__eyebrow" style={{ marginBottom: 10 }}>{title}</div>}
      <div className={["ai-actions", row ? "ai-actions--row" : ""].filter(Boolean).join(" ")}>
        {actions.map((a, i) => {
          const cls = [
            "ai-action",
            a.tone === "primary" ? "ai-action--primary" : "",
            a.tone === "danger" ? "ai-action--danger" : "",
          ].filter(Boolean).join(" ");
          const iconTint = a.tone === "primary"
            ? { background: "rgba(255,255,255,.18)", color: "#fff" }
            : a.tone === "danger"
            ? { background: "var(--danger-tint)", color: "var(--danger)" }
            : { background: "var(--paytm-blue-100)", color: "var(--paytm-navy-800)" };
          return (
            <button key={i} className={cls} onClick={a.onClick} style={{ flex: row ? 1 : undefined }}>
              {a.icon && <span className="ai-action__icon" style={iconTint}><Icon name={a.icon} size={17} /></span>}
              <span className="ai-action__text">
                <span className="ai-action__title">{a.title}</span>
                {a.sub && <span className="ai-action__sub">{a.sub}</span>}
              </span>
              {!row && a.tone !== "primary" && <Icon name="chevron-right" size={16} style={{ color: "var(--ink-300)" }} />}
            </button>
          );
        })}
      </div>
    </div>
  );
}


// === components/copilot/CopilotChat.jsx ===

function Typing() {
  return <span className="ai-typing"><i /><i /><i /></span>;
}

/**
 * CopilotChat — the Paytm AI Copilot conversation surface. Works as a
 * full-height mobile sheet or a web side-panel (`surface`). Renders
 * conversation history, a typing indicator, suggested prompts and the
 * composer. Replies are simulated via `getReply` (swap for a real call).
 */
function CopilotChat({
  title = "Paytm AI",
  subtitle = "Your money assistant",
  surface = "mobile",                 // "mobile" | "web"
  initialMessages,
  suggestedPrompts = [
    "Where did my money go this month?",
    "Pay my electricity bill",
    "Did I get my refund?",
  ],
  quickActions = [
    { icon: "scan", label: "Scan" },
    { icon: "indian-rupee", label: "Pay" },
    { icon: "wallet", label: "Balance" },
  ],
  getReply,
  onClose,
  className = "",
  style = {},
}) {
  const [messages, setMessages] = React.useState(
    initialMessages || [
      { from: "assistant", text: "Hi Sahil 👋 I can help you pay, track spending or spot anything unusual. What's on your mind?" },
    ]
  );
  const [draft, setDraft] = React.useState("");
  const [thinking, setThinking] = React.useState(false);
  const streamRef = React.useRef(null);

  React.useEffect(() => {
    const el = streamRef.current;
    if (el) el.scrollTop = el.scrollHeight;
  }, [messages, thinking]);

  const fallbackReply = (q) =>
    "Here's what I found. You spent ₹8,420 on food this month — about 18% more than last month. Want me to set a budget?";

  function send(text) {
    const t = (text != null ? text : draft).trim();
    if (!t) return;
    setMessages((m) => [...m, { from: "user", text: t }]);
    setDraft("");
    setThinking(true);
    const reply = getReply ? getReply(t) : fallbackReply(t);
    setTimeout(() => {
      setThinking(false);
      setMessages((m) => [...m, { from: "assistant", text: reply }]);
    }, 900);
  }

  return (
    <div className={["ai-chat", className].filter(Boolean).join(" ")} style={{ borderRadius: surface === "web" ? "var(--r-lg)" : 0, overflow: "hidden", ...style }}>
      {/* header */}
      <div style={{ display: "flex", alignItems: "center", gap: 10, padding: "14px 16px", background: "#fff", boxShadow: "0 1px 0 var(--line-200)" }}>
        <AIAvatar size={36} />
        <div style={{ flex: 1 }}>
          <div style={{ fontSize: "var(--fs-md)", fontWeight: 700, color: "var(--ink-900)", lineHeight: 1.2 }}>{title}</div>
          <div style={{ fontSize: "var(--fs-xs)", color: "var(--success)", fontWeight: 600, display: "flex", alignItems: "center", gap: 5 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "var(--success)" }} /> {subtitle}
          </div>
        </div>
        <button onClick={onClose} aria-label="Close" style={{ border: 0, background: "var(--line-100)", width: 32, height: 32, borderRadius: "50%", display: "grid", placeItems: "center", cursor: "pointer", color: "var(--ink-600)" }}>
          <Icon name="x" size={18} />
        </button>
      </div>

      {/* stream */}
      <div className="ai-chat__stream" ref={streamRef}>
        {messages.map((m, i) =>
          m.from === "assistant" ? (
            <div className="ai-bubble__row" key={i}>
              <AIAvatar size={26} soft />
              <div className="ai-bubble ai-bubble--assistant">{m.text}</div>
            </div>
          ) : (
            <div className="ai-bubble ai-bubble--user" key={i}>{m.text}</div>
          )
        )}
        {thinking && (
          <div className="ai-bubble__row">
            <AIAvatar size={26} soft />
            <div className="ai-bubble ai-bubble--assistant"><Typing /></div>
          </div>
        )}
      </div>

      {/* suggested prompts */}
      {messages.length <= 1 && (
        <div className="ai-chat__prompts">
          {suggestedPrompts.map((p, i) => (
            <Chip key={i} variant="ai" icon={i === 0 ? "sparkle" : undefined} onClick={() => send(p)}>{p}</Chip>
          ))}
        </div>
      )}

      {/* composer */}
      <div className="ai-chat__composer">
        <button aria-label="Voice" style={{ border: 0, background: "transparent", color: "var(--paytm-blue)", cursor: "pointer", display: "grid", placeItems: "center", width: 28 }}>
          <Icon name="mic" size={22} />
        </button>
        <input
          className="ai-chat__input"
          placeholder="Ask Paytm AI anything…"
          value={draft}
          onChange={(e) => setDraft(e.target.value)}
          onKeyDown={(e) => { if (e.key === "Enter") send(); }}
        />
        <button className="ai-chat__send" disabled={!draft.trim()} onClick={() => send()} aria-label="Send">
          <Icon name="arrow-up-right" size={20} />
        </button>
      </div>
    </div>
  );
}


// === components/voice/VoiceAssistant.jsx ===

const COPY = {
  idle:       { status: "Tap to speak", hint: "Try \"Send ₹500 to Mom\" or \"What's my balance?\"" },
  listening:  { status: "Listening…", hint: "Speak now — tap again to stop" },
  processing: { status: "Working on it…", hint: "Understanding your request" },
  responding: { status: "Here you go", hint: "" },
};

function Wave({ active }) {
  const bars = [10, 18, 26, 16, 22, 12, 20, 14];
  return (
    <div className="ai-voice__wave" aria-hidden="true">
      {bars.map((h, i) => (
        <i key={i} style={{
          height: active ? h : 4,
          transition: "height .3s var(--ease-standard)",
          opacity: active ? 1 : .4,
        }} />
      ))}
    </div>
  );
}

/**
 * VoiceAssistant — voice-first surface for both consumer (send money,
 * balance, transaction search) and merchant (sales / inventory / business
 * questions). Drives four states: idle, listening, processing, responding.
 * Uncontrolled by default — tap the orb to walk the demo cycle; pass
 * `state` + `onStateChange` to control it.
 */
function VoiceAssistant({
  state: controlled,
  onStateChange,
  transcript,
  response,
  audience = "consumer",
  className = "",
  style = {},
}) {
  const [internal, setInternal] = React.useState("idle");
  const state = controlled || internal;
  const copy = COPY[state] || COPY.idle;

  const demoTranscript = transcript ||
    (audience === "merchant" ? "How were my sales yesterday?" : "Send ₹500 to Mom");
  const demoResponse = response ||
    (audience === "merchant"
      ? "You made ₹24,380 across 96 orders yesterday — 12% up on Tuesday."
      : "Ready to send ₹500 to Mom from your KVB account. Confirm?");

  function setState(s) {
    if (onStateChange) onStateChange(s);
    if (!controlled) setInternal(s);
  }

  function cycle() {
    const next = { idle: "listening", listening: "processing", processing: "responding", responding: "idle" }[state];
    setState(next);
    if (state === "listening") setTimeout(() => setState("responding"), 1100);
  }

  return (
    <div className={["ai-voice", className].filter(Boolean).join(" ")} style={style}>
      <button
        onClick={cycle}
        aria-label={copy.status}
        className={["ai-orb", state === "listening" ? "ai-orb--listening" : "", state === "processing" ? "ai-orb--processing" : ""].filter(Boolean).join(" ")}
        style={{ border: 0, background: "transparent", cursor: "pointer", padding: 0 }}
      >
        {state === "listening" && <><span className="ai-orb__ring" /><span className="ai-orb__ring r2" /></>}
        <span className="ai-orb__core">
          <Icon name={state === "responding" ? "check" : "mic"} size={40} strokeWidth={2} />
        </span>
      </button>

      {(state === "listening" || state === "processing") && <Wave active={state === "listening"} />}

      {(state === "listening" || state === "responding") && (
        <div className="ai-voice__transcript">
          {state === "responding" ? demoResponse : demoTranscript}
        </div>
      )}

      <div style={{ textAlign: "center" }}>
        <div className="ai-voice__status">{copy.status}</div>
        {copy.hint && <div className="ai-voice__hint" style={{ marginTop: 6 }}>{copy.hint}</div>}
      </div>
    </div>
  );
}

// PayConfirm — a payment confirmation that the AI flags as risky. Shows
// the AIRiskAlert, an explainability panel and decision actions. Demonstrates

function PayConfirm({ onClose, onBlocked }) {
  const [decision, setDecision] = React.useState(null); // null | "blocked" | "proceeded"

  if (decision) {
    const blocked = decision === "blocked";
    return (
      <div style={{ height: "100%", background: "#fff", display: "flex", flexDirection: "column" }}>
        <FlowHeader title="Payment" onBack={onClose} />
        <div style={{ flex: 1, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 16, padding: 24, textAlign: "center" }}>

            {blocked ? "Payment blocked" : "Payment sent"}
          </div>
          <div style={{ fontSize: 14, color: "var(--ink-600)", maxWidth: 260, lineHeight: 1.5 }}>
            {blocked
              ? "We stopped this transfer and reported the payee. Your ₹4,000 is safe."
              : "₹4,000 sent. We'll keep an eye on this payee for you."}
          </div>
          <Button variant="primary" size="lg" onClick={onClose} style={{ marginTop: 8 }}>Done</Button>
        </div>
      </div>
    );
  }

  return (
    <div style={{ height: "100%", background: "var(--bg-page)", display: "flex", flexDirection: "column" }}>
      <FlowHeader title="Confirm payment" onBack={onClose} />

          </div>
          <div style={{ fontSize: 20, fontWeight: 700, color: "var(--ink-900)" }} className="tnum">₹4,000</div>
        </div>

        <AIRiskAlert
          severity="high"
          title="This looks like a scam request"
          body="This payee was reported 14 times this week. Paytm never asks you to pay to receive a refund or prize."
          confidence="high"
          primaryLabel="Block & report"
          secondaryLabel="Proceed anyway"
          onPrimary={() => setDecision("blocked")}
          onSecondary={() => setDecision("proceeded")}

        <AIExplainabilityPanel
