<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); display: flex; align-items: flex-end; gap: 18px; }
  .c { text-align: center; }
  .bar { background: var(--paytm-blue); border-radius: 3px; width: 100%; }
  .box { display: flex; align-items: flex-end; height: 64px; }
  .lbl { font-size: 11px; color: var(--ink-600); margin-top: 8px; font-variant-numeric: tabular-nums; }
  .px { font-size: 10px; color: var(--ink-400, #9aa3b0); }
</style>
</head>
<body>
  <div class="c"><div class="box"><div class="bar" style="height:4px;width:20px"></div></div><div class="lbl">2 · 4</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:8px;width:20px"></div></div><div class="lbl">3 · 8</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:12px;width:24px"></div></div><div class="lbl">4 · 12</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:16px;width:28px"></div></div><div class="lbl">5 · 16</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:20px;width:32px"></div></div><div class="lbl">6 · 20</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:24px;width:36px"></div></div><div class="lbl">7 · 24</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:32px;width:44px"></div></div><div class="lbl">8 · 32</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:40px;width:52px"></div></div><div class="lbl">9 · 40</div></div>
  <div class="c"><div class="box"><div class="bar" style="height:48px;width:60px"></div></div><div class="lbl">10 · 48</div></div>
</body>
</html>
