<!-- @dsCard group="Colors" viewport="700x180" name="Brand · Blue family" subtitle="Cyan, accent blue, navy — the Paytm spine" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; }
  .sw { width: 104px; }
  .chip { height: 64px; border-radius: var(--r-md); box-shadow: var(--elev-hairline); }
  .name { font-size: 12px; font-weight: 600; color: var(--ink-900); margin: 8px 0 1px; }
  .hex { font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--paytm-cyan)"></div><div class="name">Cyan</div><div class="hex">#00BAF2</div></div>
    <div class="sw"><div class="chip" style="background:var(--paytm-blue)"></div><div class="name">Accent Blue</div><div class="hex">#3199E4</div></div>
    <div class="sw"><div class="chip" style="background:var(--paytm-blue-600)"></div><div class="name">Blue 600</div><div class="hex">#2480D6</div></div>
    <div class="sw"><div class="chip" style="background:var(--paytm-periwinkle)"></div><div class="name">Periwinkle</div><div class="hex">#577FCB</div></div>
    <div class="sw"><div class="chip" style="background:var(--paytm-navy-800)"></div><div class="name">Navy 800</div><div class="hex">#0E467A</div></div>
    <div class="sw"><div class="chip" style="background:var(--paytm-navy)"></div><div class="name">Navy</div><div class="hex">#002970</div></div>
  </div>
</body>
</html>
