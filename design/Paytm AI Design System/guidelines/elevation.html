<!-- @dsCard group="Spacing" viewport="700x190" name="Elevation" subtitle="Hairline is the signature — blur only for floating UI" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--bg-page); display: flex; gap: 26px; align-items: flex-start; flex-wrap: wrap; }
  .c { text-align: center; }
  .b { width: 124px; height: 70px; background: var(--surface); border-radius: var(--r-md); }
  .lbl { font-size: 11px; color: var(--ink-600); margin-top: 12px; }
</style>
</head>
<body>
  <div class="c"><div class="b" style="box-shadow:var(--elev-hairline)"></div><div class="lbl">hairline · cards</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--elev-1)"></div><div class="lbl">elev-1</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--elev-2)"></div><div class="lbl">elev-2 · raised</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--elev-3)"></div><div class="lbl">elev-3 · sheets</div></div>
  <div class="c"><div class="b" style="box-shadow:var(--elev-soft-blue)"></div><div class="lbl">soft-blue glow</div></div>
</body>
</html>
