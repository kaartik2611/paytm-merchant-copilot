<!-- @dsCard group="Type" viewport="700x230" name="Type scale" subtitle="Inter — display to micro, mobile-first ramp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--surface); }
  .r { display: flex; align-items: baseline; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--line-100); }
  .r:last-child { border-bottom: 0; }
  .meta { width: 96px; flex: none; font-size: 11px; color: var(--ink-500); font-variant-numeric: tabular-nums; }
  .spec { color: var(--ink-900); font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="r"><div class="meta">32 · Bold</div><div class="spec" style="font-size:32px;font-weight:700;letter-spacing:-.01em">₹2,48,500</div></div>
  <div class="r"><div class="meta">24 · Bold</div><div class="spec" style="font-size:24px;font-weight:700">Hero amount</div></div>
  <div class="r"><div class="meta">20 · Bold</div><div class="spec" style="font-size:20px;font-weight:700">Section header</div></div>
  <div class="r"><div class="meta">16 · Bold</div><div class="spec" style="font-size:16px;font-weight:700">Screen title</div></div>
  <div class="r"><div class="meta">15 · Medium</div><div class="spec" style="font-size:15px;font-weight:500">Body — primary list row</div></div>
  <div class="r"><div class="meta">13 · Bold</div><div class="spec" style="font-size:13px;font-weight:700">Card section title</div></div>
  <div class="r"><div class="meta">12 · Medium</div><div class="spec" style="font-size:12px;font-weight:500;color:var(--ink-600)">Helper & meta text</div></div>
  <div class="r"><div class="meta">10 · Bold caps</div><div class="spec" style="font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-500)">100% Secure</div></div>
</body>
</html>
