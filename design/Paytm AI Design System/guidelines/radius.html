<!-- @dsCard group="Spacing" viewport="700x170" name="Radius" subtitle="5 chips · 10 cards · 20 sheets · pill" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface); display: flex; gap: 20px; align-items: flex-end; }
  .c { text-align: center; }
  .b { width: 86px; height: 64px; background: var(--paytm-blue-100); box-shadow: var(--elev-hairline); }
  .lbl { font-size: 11px; color: var(--ink-600); margin-top: 9px; }
  .pill { width: 110px; height: 40px; }
</style>
</head>
<body>
  <div class="c"><div class="b" style="border-radius:var(--r-xs)"></div><div class="lbl">xs · 4</div></div>
  <div class="c"><div class="b" style="border-radius:var(--r-sm)"></div><div class="lbl">sm · 5</div></div>
  <div class="c"><div class="b" style="border-radius:var(--r-md)"></div><div class="lbl">md · 10</div></div>
  <div class="c"><div class="b" style="border-radius:var(--r-lg)"></div><div class="lbl">lg · 14</div></div>
  <div class="c"><div class="b" style="border-radius:var(--r-xl)"></div><div class="lbl">xl · 20</div></div>
  <div class="c"><div class="b pill" style="border-radius:var(--r-pill)"></div><div class="lbl">pill</div></div>
</body>
</html>
